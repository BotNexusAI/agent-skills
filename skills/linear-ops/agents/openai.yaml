interface:
  display_name: "Linear Ops"
  short_description: "Route and manage Linear work."
  default_prompt: "Use $linear-ops to draft or create a routed Linear ticket from the work we discussed."

dependencies:
  tools:
    - type: "mcp"
      value: "linear"
      description: "Linear MCP server for finding, creating, and updating issues, projects, and comments."
      transport: "streamable_http"
      url: "https://mcp.linear.app/mcp"

policy:
  allow_implicit_invocation: true
